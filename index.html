<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Homerun · Istanbul · Live</title>

  <!-- MapLibre GL JS -->
  <link rel="stylesheet" href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css" />
  <script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>

  <!-- Deck.gl standalone bundle (includes all layers) -->
  <script src="https://unpkg.com/deck.gl@9.0.32/dist.min.js"></script>

  <link rel="stylesheet" href="css/style.css" />
</head>
<body>

  <!-- Map fills the viewport -->
  <div id="map"></div>

  <!-- Review cards overlay (positioned absolutely over map) -->
  <div id="review-overlay"></div>

  <!-- Top-left branding + city toggle -->
  <div id="brand">
    <span class="brand-name">homerun</span>
    <span class="brand-city">Istanbul · Live</span>
    <div id="city-toggle">
      <button class="city-btn active" data-city="istanbul">Istanbul</button>
      <button class="city-btn" data-city="milano">Milano</button>
    </div>
  </div>

  <!-- Bottom HUD -->
  <div id="hud">
    <div id="hud-controls">
      <button id="btn-play" title="Play / Pause">&#9654;</button>
      <select id="speed-select">
        <option value="1" selected>1×</option>
        <option value="3">3×</option>
        <option value="6">6×</option>
        <option value="12">12×</option>
        <option value="30">30×</option>
      </select>
      <input type="range" id="scrubber" min="0" max="600000" value="0" step="1000" />
      <span id="time-display">00:00 / 10:00</span>
    </div>
    <div id="hud-stats">
      <div class="stat">
        <span class="stat-value" id="stat-jobs">0</span>
        <span class="stat-label">Requests</span>
      </div>
      <div class="stat-divider"></div>
      <div class="stat">
        <span class="stat-value" id="stat-reviews">0</span>
        <span class="stat-label">Reviews</span>
      </div>
    </div>
  </div>

  <!-- Legend -->
  <div id="legend">
    <div class="legend-item"><span class="dot" style="background:#00d4ff"></span>Cleaning</div>
    <div class="legend-item"><span class="dot" style="background:#ff6b35"></span>Repair</div>
    <div class="legend-item"><span class="dot" style="background:#e040fb"></span>Beauty</div>
    <div class="legend-item"><span class="dot" style="background:#69f0ae"></span>Moving</div>
    <div class="legend-item"><span class="dot" style="background:#ffea00"></span>Education</div>
    <div class="legend-item"><span class="dot" style="background:#ff6e40"></span>Events</div>
  </div>

  <script type="module" src="js/main.js"></script>
</body>
</html>
