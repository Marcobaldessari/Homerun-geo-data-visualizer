<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Homerun · Istanbul · Live</title>

  <!-- MapLibre GL JS -->
  <link rel="stylesheet" href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css" />
  <script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>

  <!-- Deck.gl standalone bundle (includes all layers) -->
  <script src="https://unpkg.com/deck.gl@9.0.32/dist.min.js"></script>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto+Mono:wght@400;500&display=swap" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body class="hud-hidden">

  <!-- Map fills the viewport -->
  <div id="map"></div>

  <!-- Review cards overlay (positioned absolutely over map) -->
  <div id="review-overlay"></div>

  <!-- Top-left branding + city toggle -->
  <div id="brand">
    <img src="assets/homerundata-logo.png" class="brand-logo" alt="Homerun Data" />
    <div id="city-toggle">
      <button class="city-btn active" data-city="istanbul">Istanbul</button>
      <button class="city-btn" data-city="milano">Milano</button>
    </div>
  </div>

  <!-- Bottom HUD (timeline only — toggle with H) -->
  <div id="hud" class="hidden">
    <div id="hud-controls">
      <button id="btn-play" title="Play / Pause">&#9654;</button>
      <select id="speed-select">
        <option value="1" selected>1×</option>
        <option value="3">3×</option>
        <option value="6">6×</option>
        <option value="12">12×</option>
        <option value="30">30×</option>
      </select>
      <input type="range" id="scrubber" min="0" max="600000" value="0" step="1000" />
    </div>
  </div>

  <!-- Clock -->
  <div id="time-display">00:00</div>

  <!-- Stats — bottom-left, above HUD -->
  <div id="hud-stats">
    <div class="stat">
      <span class="stat-value" id="stat-jobs">0</span>
      <span class="stat-label">Requests</span>
    </div>
    <div class="stat-divider"></div>
    <div class="stat">
      <span class="stat-value" id="stat-reviews">0</span>
      <span class="stat-label">Reviews</span>
    </div>
  </div>

  <!-- Layer toggles — bottom-right, above HUD -->
  <div id="layer-toggle">
    <button class="layer-btn active" data-layer="showRequests">Requests</button>
    <button class="layer-btn active" data-layer="showQuotes">Quotes</button>
    <button class="layer-btn active" data-layer="showReviews">Reviews</button>
    <button class="layer-btn" id="btn-toggle-hud">Controls</button>
  </div>

  <!-- Legend -->
  <div id="legend">
    <div class="legend-item"><span class="dot" style="background:#73C6FF"></span>Cleaning</div>
    <div class="legend-item"><span class="dot" style="background:#EC702C"></span>Repair</div>
    <div class="legend-item"><span class="dot" style="background:#FF8772"></span>Beauty</div>
    <div class="legend-item"><span class="dot" style="background:#D3ED71"></span>Moving</div>
    <div class="legend-item"><span class="dot" style="background:#FFC32D"></span>Education</div>
    <div class="legend-item"><span class="dot" style="background:#99A0FF"></span>Events</div>
  </div>

  <script type="module" src="js/main.js"></script>
</body>
</html>
